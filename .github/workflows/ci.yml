name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maximus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maximus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maximus_test
      API_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maximus_test
      MAXIMUS_ALLOW_AUTH_FIXTURES: "1"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: maximus_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_KEY: "base64:Q0ktb25seS0zMi1ieXRlLWtleS1mb3ItbWF4aW11cyE="
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pgsql, pdo_pgsql
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Laravel dependencies
        working-directory: artifacts/api-server/laravel
        run: composer install --no-interaction --prefer-dist
      - name: Run Laravel migrations on the isolated test database
        working-directory: artifacts/api-server/laravel
        run: php artisan migrate --force
      - name: Typecheck
        run: pnpm run typecheck
      - name: Laravel regression tests
        working-directory: artifacts/api-server/laravel
        run: php artisan test --compact
      - name: Chauffeur GPS lifecycle regression tests
        run: pnpm --filter @workspace/maximus-chauffeur test
      - name: MAXIMUS tests
        run: pnpm --filter @workspace/maximus test
      - name: API authorization and authentication tests
        run: pnpm --filter @workspace/api-server test
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=low
      - name: Audit Composer dependencies
        working-directory: artifacts/api-server/laravel
        run: composer audit --locked
