services:
  - type: web
    name: maximus-erp
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter
    healthCheckPath: /api/healthz
    autoDeploy: true
    disk:
      name: maximus-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://maximus-erp-1vab.onrender.com
      - key: MAXIMUS_DEPLOYMENT_MODE
        value: central
      - key: APP_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maximus-postgres
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: MAXIMUS_CUSTOM_DOMAIN_TARGET
        value: maximus-erp-1vab.onrender.com
      - key: MAXIMUS_CENTRAL_PUBLIC_URL
        value: https://maximus-erp-1vab.onrender.com
      - key: MAXIMUS_GITHUB_RELEASE_REPOSITORY
        value: maoddoka-wq/Maximus
      - key: MAXIMUS_GITHUB_READ_TOKEN
        sync: false
      - key: CACHE_STORE
        value: database
      - key: DIGITAL_STORAGE_PATH
        value: /var/data/digital-products
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DIAMANOPAY_BASE_URL
        value: https://api.diamanopay.com
      - key: DIAMANOPAY_ACCESS_TOKEN
        sync: false
      - key: DIAMANOPAY_CLIENT_ID
        sync: false
      - key: DIAMANOPAY_CLIENT_SECRET
        sync: false
      - key: DIAMANOPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: maximus-postgres
    plan: 0.1c-256mb
    databaseName: maximus
    user: maximus